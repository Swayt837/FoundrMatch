name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # Catches the class of bug where a screen reads a field that the User type
      # never declared — Expo's bundler does not typecheck, so nothing else would.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

  backend:
    name: Backend (compile + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check every module
        run: python -m compileall -q .

      # Every dependency is public now. requirements.txt used to pin a privately
      # hosted litellm wheel and the emergentintegrations SDK, so CI could only
      # install a hand-listed subset and could never import the app itself.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Proves the app actually starts — a broken import or a bad router mount is
      # invisible to a unit suite that only imports leaf modules.
      - name: Import the app
        run: python -c "import server; print(len(server.app.openapi()['paths']), 'routes')"

      # The whole directory: tests/conftest.py skips the suites that need a
      # deployed backend (they run only when EXPO_PUBLIC_BACKEND_URL is set), so
      # new unit suites are picked up automatically instead of needing to be
      # listed here.
      - name: Unit tests
        run: pytest tests -o addopts='' -q
