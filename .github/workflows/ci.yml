name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # Catches the class of bug where a screen reads a field that the User type
      # never declared — Expo's bundler does not typecheck, so nothing else would.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

  backend:
    name: Backend (compile + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check every module
        run: python -m compileall -q .

      # requirements.txt pins a privately hosted litellm wheel and the
      # emergentintegrations SDK, which CI cannot fetch. The unit suites are
      # written to need none of that, so only their dependencies are installed
      # here.
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio pydantic email-validator fastapi motor python-dotenv

      # The whole directory: tests/conftest.py skips the suites that need a
      # deployed backend (they run only when EXPO_PUBLIC_BACKEND_URL is set), so
      # new unit suites are picked up automatically instead of needing to be
      # listed here.
      - name: Unit tests
        run: pytest tests -o addopts='' -q
